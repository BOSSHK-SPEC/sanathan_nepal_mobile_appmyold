targets:
  $default:
    builders:
      freezed:
        options:
          # Generated unions rely on Dart 3 pattern matching (switch) – no
          # when/map helpers, keeps generated code small.
          when: false
          map: false
      json_serializable:
        options:
          explicit_to_json: true
          field_rename: snake
          include_if_null: false
