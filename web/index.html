<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sanathan_nepal_mobile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sanatan</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Loads without a service worker: Flutter's is deprecated, and a cached
    worker is how a browser keeps running an old build after a deploy. The
    flutter_service_worker.js still emitted by the build unregisters any worker
    an earlier version of this page installed.
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load();
  </script>
</body>
</html>
