<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    A folder URL of the static public site (/welcome/kn/, /welcome/en/privacy/)
    reaches this page on servers that don't resolve folder indexes (flutter run,
    or a server without deploy/console/nginx.conf). Send it to the file straight
    away, before the Flutter engine is downloaded at all. /welcome/ is only ever
    the public site, so this cannot catch an app route.
  -->
  <script>
    (function () {
      var path = window.location.pathname;
      if (path.indexOf('/welcome/') === 0 && !/\.[a-z0-9]+$/i.test(path)) {
        window.location.replace(path.replace(/\/?$/, '/') + 'index.html' + window.location.search + window.location.hash);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sanathan_nepal_mobile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sanatan</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Boot screen: shown while the Flutter engine downloads and starts, instead of
    a blank white page. It matches the public site's splash (landing/), loops
    because the wait has no known length, and fades out on Flutter's first
    frame. Inline on purpose: it must paint before any other request finishes.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #05070f; }
    #boot {
      position: fixed; inset: 0; z-index: 2147483000;
      display: grid; place-items: center; align-content: center; gap: 22px;
      background: radial-gradient(60% 50% at 50% 45%, #141a33 0%, #0a0d1d 45%, #05070f 100%);
      transition: opacity 400ms ease, visibility 0s linear 400ms;
    }
    #boot.is-done { opacity: 0; visibility: hidden; }
    #boot svg { width: clamp(120px, 26vmin, 190px); height: auto; overflow: visible; filter: drop-shadow(0 0 14px rgba(232, 176, 75, 0.28)); }
    #boot .line { fill: none; stroke: #e8b04b; stroke-width: 1.3; stroke-linejoin: round; }
    #boot .line--soft { stroke-width: 0.8; opacity: 0.7; }
    #boot .petal { fill: rgba(200, 53, 42, 0.16); stroke: #e8b04b; stroke-width: 0.9; }
    #boot .lotus { transform-box: view-box; transform-origin: 100px 100px; animation: boot-breathe 2.8s ease-in-out infinite; }
    #boot .flame { transform-box: view-box; transform-origin: 100px 100px; animation: boot-flicker 1.6s ease-in-out infinite alternate; }
    #boot .bindu { fill: #fff3d2; }
    #boot .orbit { transform-box: view-box; transform-origin: 100px 100px; animation: boot-orbit 2.8s linear infinite; }
    #boot .orbit circle { fill: #ffd690; }
    #boot p {
      margin: 0; font: 400 clamp(1.4rem, 4vw, 2rem)/1.1 Georgia, 'Times New Roman', serif; letter-spacing: 0.02em;
      color: transparent; -webkit-background-clip: text; background-clip: text;
      background-image: linear-gradient(100deg, #f4ebdd 0%, #f4ebdd 40%, #ffe3a6 50%, #f4ebdd 60%, #f4ebdd 100%);
      background-size: 260% 100%; animation: boot-shimmer 2.4s ease-in-out infinite;
    }
    @keyframes boot-breathe { 0%, 100% { scale: 0.96; opacity: 0.85; } 50% { scale: 1.02; opacity: 1; } }
    @keyframes boot-flicker { 0% { scale: 1; opacity: 1; } 45% { scale: 1.1; opacity: 0.85; } 100% { scale: 0.94; opacity: 1; } }
    @keyframes boot-orbit { to { rotate: 360deg; } }
    @keyframes boot-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0% 0; } }
    @media (prefers-reduced-motion: reduce) {
      #boot .lotus, #boot .flame, #boot .orbit, #boot p { animation: none; }
      #boot p { background-position: 50% 0; }
      #boot { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot" role="progressbar" aria-busy="true" aria-label="Loading Sanatan">
    <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="boot-flame" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff6dc" />
          <stop offset="0.28" stop-color="#ffcf73" />
          <stop offset="0.62" stop-color="#e8903b" stop-opacity="0.45" />
          <stop offset="1" stop-color="#e8903b" stop-opacity="0" />
        </radialGradient>
        <path id="boot-petal" d="M100 25 C 111 36, 112 49, 100 57 C 88 49, 89 36, 100 25 Z" />
      </defs>
      <circle class="line" cx="100" cy="100" r="88" />
      <circle class="line line--soft" cx="100" cy="100" r="80" />
      <g class="lotus">
        <use class="petal" href="#boot-petal" />
        <g transform="rotate(45 100 100)"><use class="petal" href="#boot-petal" /></g>
        <g transform="rotate(90 100 100)"><use class="petal" href="#boot-petal" /></g>
        <g transform="rotate(135 100 100)"><use class="petal" href="#boot-petal" /></g>
        <g transform="rotate(180 100 100)"><use class="petal" href="#boot-petal" /></g>
        <g transform="rotate(225 100 100)"><use class="petal" href="#boot-petal" /></g>
        <g transform="rotate(270 100 100)"><use class="petal" href="#boot-petal" /></g>
        <g transform="rotate(315 100 100)"><use class="petal" href="#boot-petal" /></g>
      </g>
      <path class="line" d="M100 64 L131.2 118 L68.8 118 Z" />
      <path class="line" d="M100 136 L68.8 82 L131.2 82 Z" />
      <circle class="flame" cx="100" cy="100" r="22" fill="url(#boot-flame)" />
      <circle class="bindu" cx="100" cy="100" r="2.6" />
      <g class="orbit"><circle cx="100" cy="12" r="2.4" /></g>
    </svg>
    <p>Sanatan Nepal</p>
  </div>

  <!--
    Loads without a service worker: Flutter's is deprecated, and a cached
    worker is how a browser keeps running an old build after a deploy. The
    flutter_service_worker.js still emitted by the build unregisters any worker
    an earlier version of this page installed.
  -->
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var done = false;
      function hide() {
        if (done || !boot) return;
        done = true;
        boot.classList.add('is-done');
        boot.setAttribute('aria-busy', 'false');
        window.setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 500);
      }
      // Flutter dispatches this once its first frame is on screen.
      window.addEventListener('flutter-first-frame', hide, { once: true });
      // Never hide a failure behind a spinner forever: after 30 s show whatever is there.
      window.setTimeout(hide, 30000);
    })();
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load();
  </script>
</body>
</html>
