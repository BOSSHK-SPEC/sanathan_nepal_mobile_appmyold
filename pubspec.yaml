name: sanathan_nepal_mobile_app
description: Sanatan Nepal – Patro, Horoscope, Panchanga, Events, Marketplace & more.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Architecture / state ---
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  go_router: ^16.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # --- Data / networking / persistence ---
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  # Refresh tokens are long-lived credentials — keychain/keystore, not prefs.
  flutter_secure_storage: ^9.2.4
  # Client-generated request ids for tracing and idempotency keys.
  uuid: ^4.5.1

  # --- Nepali date utilities ---
  nepali_utils: ^3.0.8
  intl: ^0.20.2

  # --- UI ---
  flutter_svg: ^2.0.17
  fl_chart: ^1.0.0
  cupertino_icons: ^1.0.8

  # --- Device ---
  geolocator: ^14.0.2
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  web: ^1.1.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  livekit_client: ^2.12.0
  permission_handler: ^13.0.2
  share_plus: ^12.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

  # --- Code generation (freezed states/entities, JSON models) ---
  build_runner: ^2.10.5
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/images/onboarding/
    - assets/icons/onboarding/
    - assets/images/home/
    - assets/icons/home/
    - assets/images/calendar/
    - assets/icons/calendar/
    - assets/images/date_converter/
    - assets/icons/date_converter/
    - assets/images/weather/
    - assets/icons/weather/
    - assets/images/forex/
    - assets/icons/forex/
    - assets/images/horoscope/
    - assets/icons/horoscope/
    - assets/images/panchanga/
    - assets/icons/panchanga/
    - assets/images/events/
    - assets/icons/events/
    - assets/images/notifications/
    - assets/icons/notifications/
    - assets/images/marketplace/
    - assets/icons/marketplace/
    - assets/images/appointment/
    - assets/icons/appointment/
    - assets/images/profile/
    - assets/icons/profile/
    - assets/images/legal/
    - assets/icons/legal/
    - assets/images/content/
    - assets/icons/content/
    - assets/images/shared/
    - assets/icons/shared/

  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Light.ttf
          weight: 300
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mukta-ExtraBold.ttf
          weight: 800
