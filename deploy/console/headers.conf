# /etc/nginx/snippets/sanatan-console-headers.conf
#
# Included from every location: nginx drops server-level add_header directives
# in any location that declares its own, so they live in one snippet instead.

# Cache-Control is NOT set here: each location in nginx.conf sets its own
# (no-cache for Flutter's unhashed files, immutable for the landing site's
# content-hashed assets). Two Cache-Control headers on one response would be
# worse than either.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# A staff console has no business in search results.
add_header X-Robots-Tag "noindex, nofollow" always;
