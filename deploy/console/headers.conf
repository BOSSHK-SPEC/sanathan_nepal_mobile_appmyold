# /etc/nginx/snippets/sanatan-console-headers.conf
#
# Included from every location: nginx drops server-level add_header directives
# in any location that declares its own, so they live in one snippet instead.

# Flutter web file names are NOT content-hashed (main.dart.js is main.dart.js in
# every build), so any max-age serves last week's code after a deploy. no-cache
# still lets the browser keep the file — it just revalidates with the ETag and
# gets a cheap 304 when nothing changed.
add_header Cache-Control "no-cache" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# A staff console has no business in search results.
add_header X-Robots-Tag "noindex, nofollow" always;
