# nginx site for the staff console — https://console.yashwanthhk.com
#
# Install:  /etc/nginx/sites-available/console.yashwanthhk.com  (symlinked into
#           sites-enabled), then `nginx -t && systemctl reload nginx`.
# Keep the ssl_certificate lines certbot already wrote for this domain.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.yashwanthhk.com;

    ssl_certificate     /etc/letsencrypt/live/console.yashwanthhk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.yashwanthhk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A symlink swapped atomically by the deploy workflow.
    root /var/www/sanatan-console/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;

    # Real files (anything with an extension): serve or 404. A missing
    # main.dart.js must not come back as index.html with a 200.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        include /etc/nginx/snippets/sanatan-console-headers.conf;
    }

    # Everything else is a client-side route (/admin/businesses, …).
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/sanatan-console-headers.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name console.yashwanthhk.com;
    return 301 https://$host$request_uri;
}
