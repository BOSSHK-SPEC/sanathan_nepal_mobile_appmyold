# nginx site for the staff console — https://console.yashwanthhk.com
#
# Lives at /etc/nginx/sites-available/console.yashwanthhk.com (symlinked into
# sites-enabled). Install: copy over it, `nginx -t && systemctl reload nginx`.
#
# Differences from the original hand-written block:
#   * root is the `current` symlink the deploy workflow swaps atomically,
#     not a directory files are copied over in place;
#   * no `expires 30d` on .js — Flutter file names are not content-hashed, so
#     that served last month's main.dart.js after a deploy (see headers.conf);
#   * no `/api/` proxy — the console calls https://sanatan-api.yashwanthhk.com
#     directly (config/admin.json), so that proxy was unused;
#   * missing files 404 instead of answering index.html with a 200.

# The reader's language for the public pages, from the cookie the site sets when
# they choose one (landing/src/i18n). Keep the list in step with
# landing/src/i18n/locales.ts — landing/test/i18n.test.ts fails if it drifts.
map $cookie_sanatan_lang $sanatan_locale {
    ~^(en|ne|hi|as|bn|gu|kn|ml|mr|or|pa|ta|te)$  $1;
    default                                       en;
}

server {
    listen 80;
    server_name console.yashwanthhk.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name console.yashwanthhk.com;

    ssl_certificate /etc/letsencrypt/live/console.yashwanthhk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.yashwanthhk.com/privkey.pem;

    root /var/www/sanatan-console/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    # woff2 is already compressed; gzipping it only burns CPU.

    # ---- Public site (landing/, released as /welcome/) -------------------------
    # The bare domain, /privacy and /delete-account are the static site, in the
    # reader's language. Everything else is the Flutter console. If these blocks
    # are missing the console still forwards those three paths to /welcome/ —
    # slower and without these headers, but never broken.
    location = / {
        try_files /welcome/$sanatan_locale/index.html /welcome/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie" always; # the language cookie picks the page
        include /etc/nginx/snippets/sanatan-console-headers.conf;
        include /etc/nginx/snippets/sanatan-landing-csp.conf;
    }

    location ~ ^/privacy/?$ {
        try_files /welcome/$sanatan_locale/privacy/index.html /welcome/privacy/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie" always;
        include /etc/nginx/snippets/sanatan-console-headers.conf;
        include /etc/nginx/snippets/sanatan-landing-csp.conf;
    }

    # The one public page that calls the API (phone sign-in, then delete).
    location ~ ^/delete-account/?$ {
        try_files /welcome/$sanatan_locale/delete-account/index.html /welcome/delete-account/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Vary "Cookie" always;
        include /etc/nginx/snippets/sanatan-console-headers.conf;
        include /etc/nginx/snippets/sanatan-account-csp.conf;
    }

    location ^~ /welcome/ {
        # Vite content-hashes everything under assets/: a changed file is a new
        # URL, so these can be cached for good.
        location ^~ /welcome/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/sanatan-console-headers.conf;
        }

        location ~ ^/welcome/(?:[a-z]{2}/)?delete-account/ {
            try_files $uri ${uri}index.html $uri/index.html =404;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/sanatan-console-headers.conf;
            include /etc/nginx/snippets/sanatan-account-csp.conf;
        }

        # Language and page URLs are folders (/welcome/kn/privacy/): serve their
        # index.html, never the console's.
        try_files $uri ${uri}index.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/sanatan-console-headers.conf;
        include /etc/nginx/snippets/sanatan-landing-csp.conf;
    }

    # Real files (anything with an extension): serve or 404.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        # Flutter web file names are NOT content-hashed (main.dart.js is
        # main.dart.js in every build), so any max-age serves last week's code
        # after a deploy. no-cache still lets the browser keep the file — it
        # revalidates with the ETag and gets a cheap 304 when nothing changed.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/sanatan-console-headers.conf;
    }

    # Everything else is a client-side route (/sign-in, /console/businesses, …).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/sanatan-console-headers.conf;
    }
}
