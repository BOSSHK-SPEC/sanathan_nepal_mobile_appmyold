# /etc/nginx/snippets/sanatan-landing-csp.conf
#
# Content-Security-Policy for the static landing page (landing/). It ships no
# inline script or style and loads nothing from another origin — fonts and
# three.js are bundled — so it can be strict. Not applied to the Flutter
# console, whose engine needs 'wasm-unsafe-eval' and friends.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
