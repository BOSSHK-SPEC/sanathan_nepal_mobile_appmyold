# /etc/nginx/snippets/sanatan-account-csp.conf
#
# Content-Security-Policy for the Delete account page (landing/delete-account/).
# Identical to sanatan-landing-csp.conf except that it may call the Sanatan API
# — and only that origin — for phone sign-in and account deletion. Kept as a
# separate snippet so no other public page can reach the API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://sanatan-api.yashwanthhk.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
