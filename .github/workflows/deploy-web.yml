name: Deploy Web App to console.yashwanthhk.com

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      # Build the ADMIN console (lib/main_admin.dart). Without -t, Flutter
      # builds lib/main.dart — the mobile app — which is what used to get deployed.
      - name: 📦 Build Web Release (admin console)
        run: |
          flutter pub get
          flutter build web --release \
            -t lib/main_admin.dart \
            --dart-define-from-file=config/admin.json
          grep -q 'Sanatan Console' build/web/main.dart.js \
            || { echo "::error::build/web is not the admin console"; exit 1; }

      - name: 🚀 Deploy to VPS (/var/www/sanathan-web)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "build/web/*"
          target: "/var/www/sanathan-web"
          strip_components: 2
