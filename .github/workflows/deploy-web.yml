name: Deploy Web App to console.yashwanthhk.com

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 📦 Build Web Release
        run: |
          flutter pub get
          flutter build web --release

      - name: 🚀 Deploy to VPS (/var/www/sanathan-web)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "build/web/*"
          target: "/var/www/sanathan-web"
          strip_components: 2
